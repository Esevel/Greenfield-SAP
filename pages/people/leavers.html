<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>People · Leavers - Admin Portal</title>
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="/styles/catalogue.css">
  <link rel="stylesheet" href="/styles/catalogue-edit.css">
  <link rel="stylesheet" href="/styles/assets.css">
  <link rel="stylesheet" href="/styles/stock.css">
  <link rel="stylesheet" href="/styles/tracker.css">
  <link rel="stylesheet" href="/styles/people.css">
</head>
<body>
  <div class="app-container">
    <div id="sidebar-container"></div>
    
    <main class="main-content">
      <div id="header-container"></div>
      
      <div class="page-content">
        <div id="peopleHeader" data-view="leavers"></div>
        
        <div class="asset-toolbar">
          <div class="filter-chips stock-filters">
            <label class="filter-select"><span>Client</span><select id="fClient"></select></label>
            <label class="filter-select"><span>Country</span><select id="fCountry"></select></label>
            <label class="filter-select"><span>Status</span><select id="fStatus"></select></label>
          </div>
        </div>
        
        <div class="table-container">
          <table class="table catalogue-table joiners-table leavers-table">
            <thead class="catalogue-table-header">
              <tr>
                <th>Employee</th>
                <th>Client</th>
                <th>Departure date</th>
                <th>Source</th>
                <th>Linked assets</th>
                <th>Retrieval</th>
                <th>Access cutoff reminder</th>
                <th>Status</th>
                <th>Work order</th>
              </tr>
            </thead>
            <tbody id="lvRows"></tbody>
          </table>
        </div>
        <div class="table-footer-count" id="lvCount"></div>
      </div>
    </main>
  </div>
  
  <div class="side-panel" id="lvPanel" role="dialog" aria-modal="true" aria-labelledby="lvTitle">
    <div class="side-panel-header">
      <div>
        <h3 class="side-panel-title" id="lvTitle"></h3>
        <div class="device-panel-meta" id="lvMeta"></div>
      </div>
      <button class="side-panel-close" id="lvClose" aria-label="Close">&times;</button>
    </div>
    <div class="side-panel-body">
      <div class="saved-note" id="lvNote" hidden></div>
      
      <div class="panel-section">
        <h4 class="panel-section-title">Linked assets and outcome</h4>
        <ul class="lv-assets" id="lvAssets"></ul>
        <div class="readonly-note">Redeploy and store go to the client's hub; dispose goes to the disposal partner.</div>
      </div>
      
      <div class="panel-section">
        <h4 class="panel-section-title">Retrieval</h4>
        <div class="form-group">
          <label class="form-label" for="lvMethod">Method</label>
          <select class="form-select" id="lvMethod">
            <option value="box">Return box</option>
            <option value="collection">Courier collection</option>
            <option value="office">Office drop-off</option>
          </select>
        </div>
        <div class="form-group" id="lvAddressGroup">
          <label class="form-label" for="lvAddress">Return address</label>
          <textarea class="form-textarea" id="lvAddress" rows="2" placeholder="Where the courier delivers the box or collects"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label" for="lvDate" id="lvDateLabel">Dispatch return box</label>
          <input type="date" class="form-input lv-date" id="lvDate">
          <div class="input-helper" id="lvDateHint"></div>
        </div>
        <div class="form-error" id="lvError" hidden></div>
      </div>
      
      <div class="panel-section">
        <h4 class="panel-section-title">Access</h4>
        <label class="toggle-switch-label">
          <span class="toggle-switch"><input type="checkbox" id="lvReminder"><span class="toggle-slider"></span></span>
          <span>Access cutoff reminder</span>
        </label>
        <div class="input-helper" id="lvReminderHint"></div>
      </div>
      
      <div class="saved-note" id="lvDone" hidden></div>
    </div>
    <div class="side-panel-footer">
      <button class="btn btn-secondary" type="button" id="lvCancel">Close</button>
      <button class="btn btn-primary" type="button" id="lvSchedule">Schedule retrieval</button>
    </div>
  </div>
  <div class="side-panel-overlay" id="lvOverlay"></div>
  
  <script src="/scripts/navigation.js"></script>
  <script src="/scripts/components.js"></script>
  <script src="/scripts/hub-data.js"></script>
  <script src="/scripts/supply-data.js"></script>
  <script src="/scripts/stock-data.js"></script>
  <script src="/scripts/people-data.js"></script>
  <script src="/scripts/people-header.js"></script>
  <script src="/scripts/people-leavers.js"></script>
  <script src="/scripts/main.js"></script>
</body>
</html>
