<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Needs attention - Admin Portal</title>
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="/styles/catalogue.css">
  <link rel="stylesheet" href="/styles/catalogue-edit.css">
  <link rel="stylesheet" href="/styles/assets.css">
  <link rel="stylesheet" href="/styles/stock.css">
  <link rel="stylesheet" href="/styles/sla.css">
  <link rel="stylesheet" href="/styles/tracker.css">
  <link rel="stylesheet" href="/styles/orders.css">
  <link rel="stylesheet" href="/styles/support.css">
</head>
<body>
  <div class="app-container">
    <div id="sidebar-container"></div>
    
    <main class="main-content">
      <div id="header-container"></div>
      
      <div class="page-content">
        <nav class="breadcrumbs-custom">
          <span class="breadcrumb-current">Needs attention</span>
        </nav>
        <div class="page-header module-header">
          <h1 class="page-title">Needs attention</h1>
          <p class="page-description">Everything across Orders, Services and Support that is breached, at risk, blocked or unassigned, most urgent first. Work it here, then open the item to act.</p>
        </div>
        
        <div class="inventory-summary stock-summary order-tiles" id="naTiles"></div>
        <div class="segmented-control attention-kinds" id="naKinds" role="group" aria-label="Show"></div>
        <div class="asset-toolbar" id="naFilters"></div>
        
        <div class="table-container asset-table-container">
          <table class="table catalogue-table sla-table attention-table">
            <thead class="catalogue-table-header">
              <tr><th>Item</th><th>Client</th><th>Where it is</th><th>Owner</th><th>Blocker</th><th>Time</th><th>Health</th><th>Latest note</th></tr>
            </thead>
            <tbody id="naRows"></tbody>
          </table>
        </div>
        <div class="table-footer-count" id="naCount"></div>
      </div>
    </main>
  </div>
  
  <script src="/scripts/navigation.js"></script>
  <script src="/scripts/components.js"></script>
  <script src="/scripts/org-data.js"></script>
  <script src="/scripts/roles.js"></script>
  <script src="/scripts/hub-data.js"></script>
  <script src="/scripts/supply-data.js"></script>
  <script src="/scripts/sla-data.js"></script>
  <script src="/scripts/calendar-data.js"></script>
  <script src="/scripts/billing-data.js"></script>
  <script src="/scripts/subscription-data.js"></script>
  <script src="/scripts/people-data.js"></script>
  <script src="/scripts/seats-data.js"></script>
  <script src="/scripts/orders-data.js"></script>
  <script src="/scripts/orders-engine.js"></script>
  <script src="/scripts/tracker-sla.js"></script>
  <script src="/scripts/support-data.js"></script>
  <script src="/scripts/attention.js"></script>
  <script src="/scripts/main.js"></script>
</body>
</html>
