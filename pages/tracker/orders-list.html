<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work order tracker · Orders list - Admin Portal</title>
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="/styles/catalogue.css">
  <link rel="stylesheet" href="/styles/catalogue-edit.css">
  <link rel="stylesheet" href="/styles/assets.css">
  <link rel="stylesheet" href="/styles/stock.css">
  <link rel="stylesheet" href="/styles/sla.css">
  <link rel="stylesheet" href="/styles/tracker.css">
  <link rel="stylesheet" href="/styles/warehouses.css">
  <link rel="stylesheet" href="/styles/billing.css">
  <link rel="stylesheet" href="/styles/orders.css">
</head>
<body>
  <div class="app-container">
    <div id="sidebar-container"></div>
    
    <main class="main-content">
      <div id="header-container"></div>
      
      <div class="page-content">
        <nav class="breadcrumbs-custom">
          <a href="/pages/tracker/all.html" class="breadcrumb-link">Work order tracker</a>
          <span class="breadcrumb-separator">›</span>
          <span class="breadcrumb-current">Orders</span>
        </nav>
        <div class="page-header tracker-header">
          <h1 class="page-title">Work order tracker</h1>
          <span class="tracker-header-actions" id="orderActions"></span>
        </div>
        
        <nav id="trackerTabs" data-active="orders"></nav>
        
        <div class="tracker-controls">
          <div class="asset-toolbar" id="olFilters"></div>
          <div id="olView"></div>
        </div>
        
        <div class="orders-split">
          <aside class="orders-list-pane" aria-label="Orders">
            <div class="orders-list-count" id="olCount"></div>
            <div id="olList"></div>
          </aside>
          <section>
            <div class="order-tabbar" id="olTabs" role="tablist"></div>
            <div id="olDetail"></div>
          </section>
        </div>
      </div>
    </main>
  </div>
  
  <script src="/scripts/navigation.js"></script>
  <script src="/scripts/components.js"></script>
  <script src="/scripts/org-data.js"></script>
  <script src="/scripts/roles.js"></script>
  <script src="/scripts/hub-data.js"></script>
  <script src="/scripts/supply-data.js"></script>
  <script src="/scripts/sla-data.js"></script>
  <script src="/scripts/calendar-data.js"></script>
  <script src="/scripts/billing-data.js"></script>
  <script src="/scripts/contract-terms.js"></script>
  <script src="/scripts/ledger-data.js"></script>
  <script src="/scripts/invoice-data.js"></script>
  <script src="/scripts/billing-engine.js"></script>
  <script src="/scripts/orders-data.js"></script>
  <script src="/scripts/orders-engine.js"></script>
  <script src="/scripts/orders-ui.js"></script>
  <script src="/scripts/order-detail.js"></script>
  <script src="/scripts/tracker-tabs.js"></script>
  <script src="/scripts/orders-list.js"></script>
  <script src="/scripts/main.js"></script>
</body>
</html>
