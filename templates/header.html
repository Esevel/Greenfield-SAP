<header class="header">
  <div class="header-left">
    <nav class="breadcrumbs" id="breadcrumbs">
      <!-- Breadcrumbs will be injected by JavaScript -->
    </nav>
  </div>
  
  <div class="header-right">
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" placeholder="Search...">
    </div>
    
    <!-- Demo only: populated by role-switcher.js -->
    <div class="dropdown" id="role-switcher-header" hidden>
      <button class="dropdown-toggle role-switcher-toggle" id="roleSwitcherDropdown" title="Demo: view the portal as another person">
        <span class="role-switcher-prefix">Viewing as</span>
        <span id="current-user-name"></span>
        <span>▼</span>
      </button>
      <div class="dropdown-menu role-switcher-menu" id="roleSwitcherMenu"></div>
    </div>
    
    <div class="dropdown">
      <button class="dropdown-toggle" id="userDropdown">
        <span>Admin User</span>
        <span>▼</span>
      </button>
      <div class="dropdown-menu" id="userDropdownMenu">
        <a href="#" class="dropdown-menu-item">Profile</a>
        <a href="#" class="dropdown-menu-item">Settings</a>
        <a href="/login.html" class="dropdown-menu-item" data-signout>Sign Out</a>
      </div>
    </div>
  </div>
</header>
